[large_model]
provider = "openai_compatible"
enabled = true
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
supports_vision = true
timeout_seconds = 30
api_key_env = "MODEL_API_KEY"

# 向量检索：腾讯云 TokenHub（OpenAI-compatible）
# 文档：https://cloud.tencent.com/document/product/1823/133515
# kinfra-text-embedding-4b = 2560 维；0.6b = 1024 维。不可自定义 dimensions。
# API Key 在 TokenHub 控制台创建，写入 EMBEDDING_API_KEY（不要用 DeepSeek 聊天 key）。
[embedding]
provider = "openai_compatible"
enabled = true
base_url = "https://tokenhub.tencentmaas.com/v1"
model = "kinfra-text-embedding-4b"
dimensions = 2560
timeout_seconds = 30
api_key_env = "EMBEDDING_API_KEY"

[tencent_asr]
enabled = true
endpoint = "https://asr.tencentcloudapi.com"
region = "ap-guangzhou"
engine_model_type = "16k_zh"
voice_format = "mp3"
timeout_seconds = 20
secret_id_env = "TENCENT_SECRET_ID"
secret_key_env = "TENCENT_SECRET_KEY"
