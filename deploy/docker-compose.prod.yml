# 家庭业务机（Ubuntu）仓库根目录执行：
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
#
# 仅对外映射 8000（供腾讯云经 Tailscale 反代）。DEV_LOGIN 必须为空。
# Postgres / Qdrant 不映射宿主机端口。

name: dongbao-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dongbao}
      POSTGRES_USER: ${POSTGRES_USER:-dongbao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.2
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  server:
    build: ./apps/server
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dongbao}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-dongbao}
      APP_CONFIG: /app/config/providers.toml
      MEDIA_ROOT: /app/data/media
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-}
      DEV_LOGIN: ${DEV_LOGIN:-}
      TENCENT_SECRET_ID: ${TENCENT_SECRET_ID:-}
      TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      CRY_MODEL_PATH: ${CRY_MODEL_PATH:-/app/data/models/babycry-v7}
      CRY_DETECTOR_PATH: ${CRY_DETECTOR_PATH:-/app/data/models/cry-detector}
      SEED_PATH: ${SEED_PATH:-/app/data/rag/parenting_seed.json}
    volumes:
      - ./config:/app/config:ro
      - ./data/media:/app/data/media
      - ./data/models:/app/data/models:ro
      - ./data/rag:/app/data/rag:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
