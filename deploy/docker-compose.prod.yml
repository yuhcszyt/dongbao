# 在仓库根目录执行：
#   export DOMAIN=api.example.com
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
#
# 只需对公网开放 80/443。DEV_LOGIN 必须为空。

name: dongbao-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dongbao}
      POSTGRES_USER: ${POSTGRES_USER:-dongbao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  server:
    build: ./apps/server
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dongbao}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-dongbao}
      APP_CONFIG: /app/config/providers.toml
      MEDIA_ROOT: /app/data/media
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-}
      DEV_LOGIN: ${DEV_LOGIN:-}
      TENCENT_SECRET_ID: ${TENCENT_SECRET_ID:-}
      TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
    volumes:
      - ./config:/app/config:ro
      - media_data:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN=api.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:
