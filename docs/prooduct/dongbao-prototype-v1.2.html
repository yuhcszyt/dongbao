ckground:#ca7d69}@keyframes pulse{50%{box-shadow:0 0 0 12px #ca7d6915}}.wave{height:44px;display:flex;justify-content:center;align-items:center;gap:4px;margin:15px}.wave i{width:3px;border-radius:5px;background:#69b3cc}.audio{width:100%;margin:12px 0;height:40px}.art{height:120px;background:#e9efea;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:65px;margin-bottom:12px;overflow:hidden;position:relative}.art:before,.art:after{content:'';position:absolute;width:150px;height:150px;border-radius:50%;background:#ffffff60;left:-30px;top:35px}.art:after{left:auto;right:-25px;top:-55px}.article{width:100%;text-align:left}.article h3{font-size:17px;margin-bottom:5px}.article .muted{margin-top:8px}.article-body h3{margin:24px 0 9px}.article-body p{font-size:14px;line-height:1.95}.fieldrow{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:13px}.fieldrow:last-child{border:0}.fieldrow span{color:#83989f}.sheetwrap{position:absolute;inset:0;background:#19364066;z-index:10;display:flex;align-items:flex-end}.sheet{width:100%;padding:23px;background:var(--warm);border-radius:25px 25px 0 0;max-height:92%;overflow:auto}.sheet label{display:block;font-size:12px;color:#718b94;margin:15px 0 7px}.sheet input,.sheet select,.sheet textarea{width:100%;padding:12px;border:1px solid #e0eaed;border-radius:10px;background:white;color:var(--ink)}.sheet .big{font-size:36px;text-align:center;border:0;background:none;font-weight:700;padding:5px;width:150px}.stepper{display:flex;align-items:center;justify-content:center;margin:15px}.stepper button{border-radius:50%;background:#e8f2f6;width:36px;height:36px;font-size:22px}.close{font-size:24px}.toast{position:absolute;left:20px;right:20px;bottom:88px;background:#244854ef;color:white;padding:12px 16px;border-radius:12px;z-index:30;font-size:12px;text-align:center;box-shadow:0 5px 20px #19364020}.toast button{color:#aee0f1;margin-left:10px;text-decoration:underline </style></head><body><div class="layout"><aside class="intro"><div class="brand">懂宝 <span class="cloud">•ᴗ•</span></div><span class="tag">AI 育儿助手 · 交互原型 V1.2</span><h1>每一次记录，<br>都让陪伴更懂你。</h1><p>围绕宝宝的每一天，把记录、问答与成长连接起来。点击右侧手机，开始体验。</p><div class="map" id="map"></div><div class="feature-note">可体验：新增 / 修改 / 撤销记录、宝宝档案、文章收藏、AI 演示与录音流程。<br><br>数据仅保存在此浏览器。正式 Phase 1 将接入 ASR / Vision 自动预填记录；当前原型识别与分析结果均为演示，不会调用真实模型。</div></aside><main class="phone"><div class="status"><span>9:41</span><span>▮▮▮　◒　▰</span></div><div class="demo">交互原型 · 初始数据为示例 · AI 为演示</div><div id="content" class="content"></div><div id="composer"></div><nav id="nav" class="nav"></nav><div id="overlay"></div><div id="toast" hidden class="toast" role="status"></div></main></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localDate=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10),today=localDate(new Date()),nowTime=()=>new Date().toTimeString().slice(0,5),key='dongbao-prototype-v1';
const types=['喂奶','辅食','睡眠','排便','尿布','身高体重','哭闹','疫苗','用药'],icons=['🍼','🥣','☾','💩','▱','▤','◌','✚','✚'];
const initial={baby:{name:'宝宝',birth:'',sex:'女宝宝',feed:'配方奶＋辅食',allergy:'待补充'},records:[{id:1,type:'喂奶',value:150,date:today,time:'09:30',note:'配方奶'},{id:2,type:'排便',value:'黄色 · 软便',date:today,time:'08:45',note:''},{id:3,type:'睡眠',value:80,date:today,time:'07:50',note:'上午小睡'},{id:4,type:'喂奶',value:180,date:today,time:'06:30',note:'配方奶'},{id:5,type:'睡眠',value:375,date:today,time:'06:00',note:'夜间睡眠'},{id:6,type:'喂奶',value:210,date:today,time:'02:00',note:'配方奶'},{id:7,type:'辅食',value:'米糊',date:today,time:'10:30',note:''},{id:8,type:'尿布',value:'更换尿布',date:today,time:'08:50',note:''}],favorites:[],messages:[],analyses:[]};
let state;try{state=JSON.parse(localStorage.getItem(key))||structuredClone(initial);if(!state.baby||!Array.isArray(state.records))throw Error()}catch{state=structuredClone(initial)}const legacyDefault=state.baby?.name==='小米粥'||state.baby?.birth==='2026-01-06';if(state.baby?.name==='小米粥')state.baby.name='宝宝';if(state.baby?.birth==='2026-01-06')state.baby.birth='';if(legacyDefault)try{localStorage.setItem(key,JSON.stringify(state))}catch{}
let page='home',filter='全部',selectedDate=today,articleId=0,articleFilter='推荐',toastTimer,undoAction=null,recorder=null,stream=null,recTimer=null,seconds=0,audioUrl='',recording=false,recordStarting=false;
function save(){try{localStorage.setItem(key,JSON.stringify(state));return true}catch{toast('浏览器未允许保存；本次修改仅在当前页面有效');return false}}
function toast(s,undo){clearTimeout(toastTimer);undoAction=undo||null;$('#toast').innerHTML=esc(s)+(undo?' <button onclick="undoAction();hideToast()">撤销</button>':'');$('#toast').hidden=false;toastTimer=setTimeout(hideToast,5000)}function hideToast(){$('#toast').hidden=true}
function age(){const d=new Date(state.baby.birth+'T00:00:00'),n=new Date();if(isNaN(d)||d>n)return '生日待完善';let m=(n.getFullYear()-d.getFullYear())*12+n.getMonth()-d.getMonth()-(n.getDate()<d.getDate()?1:0);return m<1?'未满1个月':m+'个月'}
function head(t,action=''){return `<div class="top"><button class="back" onclick="go('home')" aria-label="返回首页">‹</button><h3>${t}</h3>${action||'<span style="width:30px"></span>'}</div>`}
function go(p){if(page==='cry'&&p!=='cry')stopRecording();page=p;$('#overlay').innerHTML='';render();$('#content').scrollTop=0}
function nav(){const tabs=[['home','⌂','首页'],['records','▤','记录'],['ai','✧','懂宝 AI'],['profile','♙','我的']];$('#nav').style.display=['home','records','ai','profile'].includes(page)?'flex':'none';$('#nav').innerHTML=tabs.map(([p,i,n])=>`<button class="${p===page?'active':''}" onclick="go('${p}')"><span>${i}</span>${n}</button>`).join('')}
function summary(date=today){const rs=state.records.filter(r=>r.date===date);return {milk:rs.filter(r=>r.type==='喂奶').reduce((s,r)=>s+Number(r.value||0),0),sleep:rs.filter(r=>r.type==='睡眠').reduce((s,r)=>s+Number(r.value||0),0),diaper:rs.filter(r=>r.type==='尿布').length,food:rs.filter(r=>r.type==='辅食').length}}
function metrics(){const s=summary();return `<div class="metrics"><div class="metric">🍼 奶量<b>${s.milk}<small> ml</small></b></div><div class="metric">☾ 睡眠<b>${Math.floor(s.sleep/60)}h${s.sleep%60}m</b></div><div class="metric">▱ 尿布<b>${s.diaper}<small> 次</small></b></div><div class="metric">🥣 辅食<b>${s.food}<small> 次</small></b></div></div>`}
function quick(){return `<div class="quick">${types.slice(0,6).map((t,i)=>`<button onclick="recordSheet('${t}')"><span class="ico">${icons[i]}</span>${t}</button>`).join('')}</div>`}
function valueText(r){return r.type==='喂奶'?r.value+' ml':r.type==='睡眠'?Math.floor(r.value/60)+'小时'+r.value%60+'分':r.value}
function timeline(limit=99){const rs=state.records.filter(r=>r.date===selectedDate&&(filter==='全部'||r.type===filter)).sort((a,b)=>b.time.localeCompare(a.time)).slice(0,limit);return rs.length?rs.map(r=>`<button class="event" onclick="recordSheet('${r.type}',${r.id})"><time>${esc(r.time)}</time><span class="bubble">${icons[types.indexOf(r.type)]||'◇'}</span><span class="data"><b>${esc(r.type)} · ${esc(valueText(r))}</b><small>${esc(r.note||'点击修改记录')}</small></span><span class="muted">›</span></button>`).join(''):'<div class="empty">这一天还没有相关记录<br>点击「添加」记下宝宝的一刻</div>'}
function home(){selectedDate=today;filter='全部';return `<div class="row"><button class="baby" onclick="go('profile')"><span class="avatar">👶🏻</span><span style="text-align:left"><b>${esc(state.baby.name)} ›</b><span class="muted" style="display:block">${age()} · 今天 ${new Date().getMonth()+1}月${new Date().getDate()}日</span></span></button><button onclick="go('help')" aria-label="原型说明">ⓘ</button></div><div class="row greeting"><div><h2>早上好，陪宝宝慢慢长大</h2><p class="muted">每一次记录，都是爱的形状</p></div></div><div class="card"><h3>今日记录</h3>${metrics()}</div><div class="card hero"><div class="row"><div><h3>关于${esc(state.baby.name)}，问问懂宝</h3><p class="muted">结合宝宝记录，陪你一起找答案</p></div><span class="cloud">•ᴗ•</span></div><button class="inputfake" onclick="go('ai')">今天想了解什么？ <span style="float:right">✧</span></button><button class="listen" onclick="go('cry')">▥　听听宝宝的哭声 <span style="float:right">›</span></button></div><div class="section"><div class="row"><h3>快速记录</h3><button class="link" onclick="recordSheet()">更多 ＋</button></div>${quick()}</div><div class="section"><div class="row"><h3>最近动态</h3><button class="link" onclick="go('records')">查看全部 ›</button></div>${timeline(3)}</div><div class="section"><div class="row"><h3>为${esc(state.baby.name)}推荐</h3><button class="link" onclick="go('articles')">更多 ›</button></div>${articleCard(0)}</div>`}
function records(){const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const date=localDate(d);return `<button class="${date===selectedDate?'active':''}" onclick="selectedDate='${date}';render()"><small>${['日','一','二','三','四','五','六'][d.getDay()]}</small>${d.getDate()}</button>`}).join('');return `<div class="top"><h2>记录</h2><button class="tag" onclick="recordSheet()">＋ 添加</button></div><div class="row"><span class="muted">用记录，留住每一个小变化</span><button class="link" onclick="go('stats')">数据统计 ›</button></div><div class="dates">${days}</div><input aria-label="选择记录日期" type="date" value="${selectedDate}" onchange="selectedDate=this.value;render()" style="border:0;background:transparent;color:#81949a"><div class="chips">${['全部','喂奶','辅食','睡眠','排便','尿布'].map(t=>`<button class="${filter===t?'active':''}" onclick="filter='${t}';render()">${t}</button>`).join('')}</div><h3>${selectedDate===today?'今天':esc(selectedDate)}</h3><div class="timeline">${timeline()}</div>`}
function recordSheet(type='喂奶',id){const r=state.records.find(x=>x.id===id);if(r)type=r.type;const numeric=type==='喂奶'||type==='睡眠';const v=r?r.value:type==='喂奶'?180:type==='睡眠'?60:'';$('#overlay').innerHTML=`<div class="sheetwrap" onclick="if(event.target===this)closeSheet()"><form class="sheet" onsubmit="saveRecord(event,${id||'null'})"><div class="row"><h3>${r?'修改':'记录'}${type}</h3><button type="button" class="close" onclick="closeSheet()" aria-label="关闭">×</button></div><label>记录类型</label><select id="rtype" ${r?'disabled':''} onchange="recordSheet(this.value,${id||'undefined'})">${types.map(t=>`<option ${t===type?'selected':''}>${t}</option>`).join('')}</select>${numeric?`<div class="stepper"><button type="button" onclick="step(-${type==='喂奶'?30:10})">−</button><input class="big" id="rvalue" type="number" min="1" max="${type==='喂奶'?2000:1440}" required value="${esc(v)}"><span>${type==='喂奶'?'ml':'分钟'}</span><button type="button" onclick="step(${type==='喂奶'?30:10})">＋</button></div><div class="chips" style="justify-content:center">${(type==='喂奶'?[120,150,180]:[30,60,90]).map(v=>`<button type="button" onclick="$('#rvalue').value=${v}">${v} ${type==='喂奶'?'ml':'分钟'}</button>`).join('')}</div>`:`<label>${type==='身高体重'?'身高 / 体重（含单位）':'记录内容'}</label><input id="rvalue" required maxlength="100" placeholder="${type==='身高体重'?'例如：70 cm / 8 kg':'例如：'+({辅食:'米糊 30g',排便:'黄色 · 软便',尿布:'更换尿布',哭闹:'睡前哭闹 5分钟',疫苗:'接种名称',用药:'名称与用量'}[type]||'宝宝的新变化')}" value="${esc(v)}">`}<label>日期与时间</label><div class="row"><input aria-label="记录日期" id="rdate" type="date" required max="${today}" value="${r?r.date:today}"><input aria-label="记录时间" id="rtime" type="time" required value="${r?r.time:nowTime()}"></div><label>备注（可选）</label><input id="rnote" maxlength="150" placeholder="添加备注" value="${esc(r?r.note:'')}"><button class="primary" type="submit">保存记录</button>${r?`<button class="outline danger" type="button" onclick="deleteRecord(${id})">删除这条记录</button>`:''}</form></div>`}
function closeSheet(){$('#overlay').innerHTML=''}function step(n){const i=$('#rvalue');i.value=Math.max(1,Math.min(Number(i.max),Number(i.value)+n))}
function saveRecord(e,id){e.preventDefault();const previous=structuredClone(state.records),type=$('#rtype').value;let r={id:id||Date.now(),type,value:['喂奶','睡眠'].includes(type)?Number($('#rvalue').value):$('#rvalue').value.trim(),date:$('#rdate').value,time:$('#rtime').value,note:$('#rnote').value.trim()};if(!r.value)return toast('请填写记录内容');state.records=id?state.records.map(x=>x.id===id?r:x):[...state.records,r];const ok=save();closeSheet();render();if(ok)toast('记录已保存',()=>{state.records=previous;save();render()})}
function deleteRecord(id){const previous=structuredClone(state.records);state.records=state.records.filter(x=>x.id!==id);const ok=save();closeSheet();render();if(ok)toast('记录已删除',()=>{state.records=previous;save();render()})}
function ai(){return `<div class="row"><div class="baby"><span class="cloud">•ᴗ•</span><div><h3>懂宝 AI</h3><p class="muted">正在结合${esc(state.baby.name)}的近期记录</p></div></div><button class="link" onclick="clearChat()">清空</button></div><div class="warn">演示对话 · 未连接大模型，不提供真实分析</div>${state.messages.length?state.messages.map(m=>`<div class="chatuser">${esc(m.q)}</div><div class="answer"><b>一起看看${esc(state.baby.name)}的记录</b><div class="evidence">${esc(m.a)}</div><p>这是交互示例。我可以在真实服务接入后，结合宝宝档案与专业资料继续回答。</p><button class="link" onclick="go('records')">查看相关记录 →</button><div class="notice" style="text-align:left">专业来源：尚未接入知识库，不生成虚构引用。</div></div>`).join(''):`<div class="welcome"><h2>今天有什么想和我聊聊？</h2><p style="margin-top:8px">我会从${esc(state.baby.name)}的日常记录出发。</p></div><div class="card"><h3>从这些问题开始</h3>${['帮我看看最近的睡眠记录','今天一共喝了多少奶？','怎么记录辅食？'].map(q=>`<button class="outline" onclick="ask('${q}')">${q}</button>`).join('')}</div><button class="outline" onclick="go('cry')">▥ 进入哭声监测</button>`}`}
function ask(q){q=(q||$('#question')?.value||'').trim();if(!q)return;const s=summary();const answer=/奶|喂养/.test(q)?`今天已有 ${state.records.filter(r=>r.date===today&&r.type==='喂奶').length} 条喂奶记录，总量 ${s.milk} ml。这里只汇总已记录数据，不代表全天实际摄入。`:/睡/.test(q)?`今天已记录睡眠 ${Math.floor(s.sleep/60)} 小时 ${s.sleep%60} 分。当前数据不足以判断睡眠变化原因，可继续记录入睡和睡醒时间。`:/辅食/.test(q)?'点击首页「辅食」，填写食物、份量和时间即可保存。今天已有 '+s.food+' 条辅食记录。':`已收到你的问题：「${q}」。当前为演示模式，不会生成真实育儿判断。已载入 ${state.baby.name} 的档案与 ${state.records.length} 条本地记录。`;state.messages.push({q,a:answer});save();page='ai';render();$('#content').scrollTop=$('#content').scrollHeight}
function clearChat(){if(!state.messages.length)return toast('还没有对话记录');$('#overlay').innerHTML=`<div class="sheetwrap"><div class="sheet"><h3>清空演示对话？</h3><p>宝宝档案和日常记录会保留。</p><button class="primary" onclick="state.messages=[];save();closeSheet();render()">确认清空</button><button class="outline" onclick="closeSheet()">取消</button></div></div>`}
const wave=()=>`<div class="wave">${Array.from({length:35},(_,i)=>`<i style="height:${8+Math.abs(Math.sin(i*2.1))*32}px"></i>`).join('')}</div>`;
function cry(){return `${head('哭声监测')}<div style="text-align:center;margin-top:24px"><h2>听一听，宝宝想说什么</h2><p class="muted">一起了解哭声背后的可能需求</p></div><button id="mic" class="mic ${recording?'recording':''}" onclick="toggleRecording()" aria-label="开始或停止录音">${recording?'■':'♩'}</button><p id="recstatus" style="text-align:center">${recording?'录音中 '+seconds+' 秒 · 点击停止':'点击开始录音'}</p>${wave()}<div id="audioarea">${audioUrl?`<audio class="audio" controls src="${audioUrl}"></audio><button class="primary" onclick="analyze()">查看模拟分析</button>`:''}</div><button class="outline" onclick="$('#audiofile').click()">↥ 上传音频</button><input hidden id="audiofile" type="file" accept="audio/*" onchange="loadAudio(this)"><button class="link" style="display:block;margin:18px auto" onclick="analyze()">不录音，直接体验模拟结果 →</button><p class="notice">录音仅在本机预览，不会上传。<br>麦克风需要浏览器授权；不可用时可上传音频。</p><div class="section"><h3>最近分析 · 演示</h3>${state.analyses.length?state.analyses.map(x=>`<button class="event" onclick="go('result')"><span class="bubble">▷</span><span><b>${esc(x.time)}</b><small class="muted">模拟结果，不代表真实分析</small></span></button>`).join(''):'<p class="notice">暂无分析记录</p>'}</div>`}
async function toggleRecording(){if(recordStarting)return;if(recording){stopRecording();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return toast('当前环境不支持录音，请使用上传音频');recordStarting=true;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});if(page!=='cry'){stream.getTracks().forEach(t=>t.stop());return}let chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{stream?.getTracks().forEach(t=>t.stop());if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));if(page==='cry')render()};recorder.start();recording=true;seconds=0;render();recTimer=setInterval(()=>{seconds++;if($('#recstatus'))$('#recstatus').textContent='录音中 '+seconds+' 秒 · 点击停止';if(seconds>=60)stopRecording()},1000)}catch{stream?.getTracks().forEach(t=>t.stop());toast('无法访问麦克风，请允许权限或上传音频')}finally{recordStarting=false}}
function stopRecording(){clearInterval(recTimer);recording=false;if(recorder?.state==='recording')recorder.stop();else stream?.getTracks().forEach(t=>t.stop())}
function loadAudio(input){const f=input.files[0];if(!f)return;if(!f.type.startsWith('audio/')&&!/\.(mp3|wav|m4a|ogg|webm|aac|flac)$/i.test(f.name))return toast('请选择音频文件');if(f.size>20*1024*1024)return toast('请选择小于20MB的音频');stopRecording();if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(f);render();toast('音频已载入，仅在本机播放')}
function analyze(){state.analyses.unshift({time:new Date().toLocaleString('zh-CN')});state.analyses=state.analyses.slice(0,10);save();go('result')}
function result(){return `${head('哭声分析结果')}<div class="warn">ⓘ 模拟结果，不代表真实分析</div>${audioUrl?`<audio class="audio" controls src="${audioUrl}"></audio>`:'<p class="notice">当前未使用音频 · 正在体验示例流程</p>'}<div class="card"><span class="tag">可能需求 · 演示</span><h2 style="margin:16px 0 8px">可以先排查这些需求</h2><p>仅凭哭声不能确定原因，需要结合宝宝现场表现与日常记录。</p>${['回顾上次喂奶时间','观察是否有困倦表现','检查尿布与环境'].map((s,i)=>`<div class="fieldrow"><b>${i+1}　${s}</b></div>`).join('')}</div><div class="card"><h3>其他可能</h3><div class="chips"><span class="tag">需要安抚</span><span class="tag">饥饿</span><span class="tag">不舒服</span></div><p class="muted">以上仅展示产品如何组织信息，并非对音频的判断。</p></div><button class="primary" onclick="ask('帮我结合记录回顾宝宝的情况')">结合记录问懂宝</button><button class="outline" onclick="go('cry')">重新录音</button><p class="notice">仅供育儿参考，不用于医疗诊断</p>`}
const articles=[{title:'读懂宝宝的睡眠节奏',category:'睡眠',why:'与你关注的睡眠记录相关',emoji:'☾',color:'#e5ece8',intro:'先记录，再了解',body:'把入睡、睡醒和夜间醒来的时间记下来，帮助回顾宝宝每天的变化。',sub:'让记录更完整',detail:'记录白天的小睡，也可以备注当时的环境、入睡方式以及醒来后的表现。连续的记录，能帮助家人交流宝宝最近的情况。'},{title:'辅食日记，怎么记更轻松？',category:'喂养',why:'适合当前辅食记录阶段',emoji:'🥣',color:'#f4e8d9',intro:'把每一次尝试记下来',body:'记录食物名称、时间和大致份量，也可以补充宝宝当时的接受情况。',sub:'从简单开始',detail:'不必把记录写成任务清单。先记下最容易遗漏的信息，之后再慢慢补充。本文仅用于演示内容阅读体验。'},{title:'开始爬行，家里准备好了吗？',category:'发育',why:'关注宝宝的探索阶段',emoji:'🧸',color:'#ede8dc',intro:'跟着宝宝的视角看一看',body:'从宝宝活动的高度，观察家中日常空间，并记下需要进一步检查的地方。',sub:'和家人一起准备',detail:'把观察到的问题分享给共同照顾宝宝的家人。正式内容将展示专业资料来源及审核信息。'}];
function articleCard(i){const a=articles[i];return `<button class="card article" onclick="articleId=${i};go('article')"><div class="art" style="background:${a.color}">${a.emoji}</div><h3>${a.title}</h3><p class="muted">${a.why}</p><div class="muted">◷ ${i+3} 分钟阅读 · 内容示例</div></button>`}
function articleList(favorites=false){return `${head(favorites?'我的收藏':'为'+esc(state.baby.name)+'推荐')}<p class="muted">${favorites?'把有用的内容留在身边':'根据宝宝当前阶段与近期记录'}</p>${favorites?'':`<div class="chips">${['推荐','喂养','睡眠','发育'].map(t=>`<button class="${articleFilter===t?'active':''}" onclick="articleFilter='${t}';render()">${t}</button>`).join('')}</div>`}${articles.map((a,i)=>(favorites?state.favorites.includes(i):articleFilter==='推荐'||articleFilter===a.category)?articleCard(i):'').join('')}${favorites&&!state.favorites.length?'<div class="empty">还没有收藏<br>打开文章，点击「收藏」即可保留。</div>':''}`}
function article(){const a=articles[articleId];return `${head('文章详情',`<button class="link" onclick="favorite()">${state.favorites.includes(articleId)?'已收藏 ♥':'收藏 ♡'}</button>`)}<span class="tag">${a.category}与陪伴</span><h2 style="font-size:27px;margin:15px 0">${a.title}</h2><div class="card hero" style="margin-bottom:16px"><b>为什么推荐给你</b><p class="muted">${a.why}</p></div><div class="art" style="height:175px;background:${a.color}">${a.emoji}</div><div class="article-body"><h3>${a.intro}</h3><p>${a.body}</p><h3>${a.sub}</h3><p>${a.detail}</p></div><div class="warn">内容示例 · 尚未接入已审核专业内容与来源</div><button class="primary" onclick="ask('关于《${a.title}》，结合宝宝记录聊一聊')">针对${esc(state.baby.name)}，问问懂宝</button><button class="outline" onclick="go('articles')">返回推荐文章</button>`}
function favorite(){const i=state.favorites.indexOf(articleId);if(i<0)state.favorites.push(articleId);else state.favorites.splice(i,1);const ok=save();render();if(ok)toast(i<0?'已收藏文章':'已取消收藏')}
function profile(){const b=state.baby;return `<div class="top"><h2>宝宝档案</h2><button class="link" onclick="profileSheet()">编辑</button></div><div style="text-align:center;margin:25px"><div class="avatar" style="margin:auto;width:76px;height:76px;font-size:47px">👶🏻</div><h2 style="margin-top:10px">${esc(b.name)}</h2><p>${age()} · ${esc(b.sex)}</p></div><div class="card"><h3>基础信息</h3>${[['昵称',b.name],['生日',b.birth||'待完善'],['性别',b.sex]].map(([k,v])=>`<div class="fieldrow"><span>${k}</span><b>${esc(v)}</b></div>`).join('')}</div><div class="card"><h3>喂养与护理</h3><div class="fieldrow"><span>喂养方式</span><b>${esc(b.feed)}</b></div><div class="fieldrow"><span>过敏信息</span><b>${esc(b.allergy)}</b></div></div><div class="card">${[['stats','数据统计'],['records','成长时间线'],['favorites','我的收藏'],['help','原型说明']].map(([p,t])=>`<button class="fieldrow" style="width:100%" onclick="go('${p}')"><b>${t}</b><span>›</span></button>`).join('')}</div><div class="card hero"><h3>多了解一点，陪伴更贴心</h3><p class="muted">资料可以慢慢补充</p></div>`}
function profileSheet(){const b=state.baby;$('#overlay').innerHTML=`<div class="sheetwrap"><form class="sheet" onsubmit="saveProfile(event)"><div class="row"><h3>编辑宝宝档案</h3><button type="button" class="close" onclick="closeSheet()">×</button></div><label>昵称</label><input id="bname" required maxlength="12" value="${esc(b.name)}"><label>生日（可稍后补充）</label><input id="bbirth" type="date" max="${today}" value="${esc(b.birth)}"><label>性别</label><select id="bsex">${['女宝宝','男宝宝'].map(s=>`<option ${s===b.sex?'selected':''}>${s}</option>`).join('')}</select><label>喂养方式</label><input id="bfeed" required maxlength="40" value="${esc(b.feed)}"><label>过敏信息</label><input id="ballergy" maxlength="80" value="${esc(b.allergy)}"><button class="primary">保存档案</button></form></div>`}
function saveProfile(e){e.preventDefault();if(!$('#bname').value.trim())return toast('请填写宝宝昵称');state.baby={name:$('#bname').value.trim(),birth:$('#bbirth').value,sex:$('#bsex').value,feed:$('#bfeed').value.trim(),allergy:$('#ballergy').value.trim()||'待补充'};const ok=save();closeSheet();render();if(ok)toast('宝宝档案已更新')}
function stats(){const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return {day:d.getDate(),...summary(localDate(d))}}),max=Math.max(1,...days.map(d=>d.milk)),s=summary();return `${head('数据统计')}<h2>记录里，看见成长</h2><p class="muted">仅统计已录入的数据，未记录不代表没有发生。</p><div class="card">${metrics()}</div><div class="card statbox"><h3>近7天奶量 · ml</h3><div class="stats">${days.map(d=>`<div style="height:${Math.max(3,d.milk/max*100)}%" title="${d.day}日：${d.milk} ml"><small>${d.day}日<br>${d.milk}</small></div>`).join('')}</div></div><div class="card"><h3>记录概览</h3><p style="margin-top:10px">共有 ${state.records.length} 条记录，${state.records.filter(r=>r.date===today).length} 条来自今天。</p></div>`}
function help(){return `${head('原型说明')}<h2>欢迎体验懂宝</h2><div class="card"><h3>可以真实操作</h3><p style="margin-top:10px">新增、修改、删除与撤销记录；日期筛选；编辑宝宝档案；查看文章并收藏；本地录音或选择音频。</p></div><div class="card"><h3>演示范围</h3><p style="margin-top:10px">AI 对话使用本地模板，Phase 1 的 ASR / Vision 识别和哭声分析均展示固定演示内容。初始记录为示例；文章未经专业内容审核。尚未连接登录、云端、家庭共享或真实模型。</p></div><div class="card"><h3>数据与隐私</h3><p style="margin-top:10px">所有记录保存在当前浏览器，音频仅在页面内临时播放，刷新后会释放。更换浏览器或清除浏览器数据不会保留本地记录。</p></div><button class="outline danger" onclick="resetSheet()">重置演示数据</button>`}
function resetSheet(){$('#overlay').innerHTML=`<div class="sheetwrap"><div class="sheet"><h3>重置全部原型数据？</h3><p>你新增的记录、档案修改、对话与收藏会被清除，并恢复初始示例。</p><button class="primary" onclick="resetData()">确认重置</button><button class="outline" onclick="closeSheet()">取消</button></div></div>`}
function resetData(){state=structuredClone(initial);save();if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl='';closeSheet();go('home');toast('已恢复初始示例')}
function render(){nav();$('#composer').innerHTML=page==='ai'?`<form class="composer" onsubmit="event.preventDefault();ask()"><input id="question" aria-label="向懂宝提问" placeholder="继续问懂宝…" maxlength="500" autocomplete="off"><button type="submit" aria-label="发送问题">↑</button></form>`:'';$('#content').innerHTML=({home,records,ai,cry,result,articles:()=>articleList(),article,profile,stats,favorites:()=>articleList(true),help}[page]||home)()}
$('#map').innerHTML=[['home','01 首页'],['record','02 快速记录'],['records','03 记录时间线'],['ai','04 懂宝 AI'],['cry','05 哭声监测'],['result','06 模拟分析结果'],['articles','07 推荐文章'],['article','08 文章详情'],['profile','09 宝宝档案']].map(([p,t])=>`<button onclick="${p==='record'?"go('home');recordSheet()":`go('${p}')`}">${t} ↗</button>`).join('');document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});window.addEventListener('pagehide',stopRecording);render();
// Accessible capture-first recording. Recognition is explicitly a local demo.
const oldHome=home,oldRecords=records,oldRecordSheet=recordSheet,oldCloseSheet=closeSheet,oldGo=go;
let captureKind='',captureData='',captureMime='',captureRec=null,captureStream=null,captureTimer=null,captureSeconds=0,captureBusy=false,captureActive=false,captureSession=0,captureReturnFocus=null;
function captureEntrances(){return `<div class="capture-entry"><h3>给宝宝记一笔</h3><p>说一句，或拍张照，就能开始记录</p><button class="voice-entry" onclick="captureHub('voice')"><span>♩</span><b>语音记录</b><small>点一下，直接说</small></button><button class="photo-entry" onclick="captureHub('photo')"><span>▣</span><b>拍照记录</b><small>拍食物、奶瓶等</small></button><button class="manual-entry" onclick="manualRecord()">也可以手动填写 ›</button></div>`}
home=function(){return oldHome().replace('<div class="section"><div class="row"><h3>快速记录</h3>',captureEntrances()+'<div class="section"><div class="row"><h3>点选记录</h3>')};
records=function(){return oldRecords().replace('<div class="dates">',captureEntrances()+'<div class="dates">')};
function stopCapture(discard=false){clearInterval(captureTimer);if(discard)captureSession++;captureActive=false;if(captureRec?.state==='recording')captureRec.stop();captureStream?.getTracks().forEach(t=>t.stop());captureStream=null}
closeSheet=function(){stopCapture(true);oldCloseSheet();captureReturnFocus?.focus?.()};
go=function(p){stopCapture(true);oldGo(p)};
function manualRecord(t='喂奶',id){stopCapture(true);oldRecordSheet(t,id);if(id){const r=state.records.find(r=>r.id===id);if(r?.capture){const form=$('#overlay .sheet');form.insertAdjacentHTML('afterbegin',`<div class="capture-source"><b>${r.capture.kind==='photo'?'照片':'语音'}记录 · ${r.capture.demo?'演示识别，经确认保存':'手动整理，经确认保存'}</b>${r.capture.kind==='photo'?`<img alt="记录的原始照片" src="${r.capture.data}">`:`<audio controls src="${r.capture.data}"></audio>`}</div>`)}}}
recordSheet=function(type,id){if(type===undefined&&!id)return captureHub();manualRecord(type||'喂奶',id)};
// Preserve the attachment when an existing record is edited through the manual form.
const oldSaveRecord=saveRecord;saveRecord=function(e,id){const media=state.records.find(r=>r.id===id)?.capture;oldSaveRecord(e,id);if(media){const r=state.records.find(r=>r.id===id);if(r){r.capture=media;save()}}};
function captureHub(kind){stopCapture(true);captureReturnFocus=document.activeElement;captureKind=kind||'';captureData='';captureMime='';$('#overlay').innerHTML=`<div class="sheetwrap"><section class="sheet elder" role="dialog" aria-modal="true" aria-label="给宝宝记一笔"><div class="row"><h2>${kind==='voice'?'语音记录':kind==='photo'?'拍照记录':'给宝宝记一笔'}</h2><button class="close" onclick="closeSheet()" aria-label="关闭">×</button></div>${kind==='voice'?`<p class="capture-lead">比如说：“宝宝刚喝了180毫升奶。”</p><button id="capture-mic" class="voice-entry" onclick="captureVoice()">♩　点击开始说话</button><p id="capture-status" role="status">说完后，再点一次结束</p><p class="muted">首次使用，请允许麦克风权限。最多录制30秒。</p><button class="outline" onclick="captureHub('photo')">不方便说？改用拍照</button>`:kind==='photo'?`<p class="capture-lead">拍下这次要记录的食物、奶瓶等。</p><button class="photo-entry" onclick="$('#capture-camera').click()">▣　打开相机拍照</button><button class="outline" onclick="$('#capture-album').click()">从相册选择照片</button><input id="capture-camera" hidden type="file" accept="image/*" capture="environment" onchange="capturePhoto(this)"><input id="capture-album" hidden type="file" accept="image/*" onchange="capturePhoto(this)"><p class="muted">手机支持时会打开后置相机；电脑可选择图片。</p>`:captureEntrances()}<button class="manual-entry" onclick="manualRecord()">直接手动填写 ›</button><div class="warn">原型说明：可以真实拍照 / 录音；正式 Phase 1 会用 ASR / Vision 自动预填，当前原型识别为演示，确认后才会保存。</div></section></div>`}
async function captureVoice(){if(captureActive){stopCapture();return}if(captureBusy)return;if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return toast('这里暂时不能录音，请改用拍照或手动填写');captureBusy=true;const token=++captureSession;let ownStream;try{ownStream=await navigator.mediaDevices.getUserMedia({audio:true});if(token!==captureSession){ownStream.getTracks().forEach(t=>t.stop());return}captureStream=ownStream;const ownRec=new MediaRecorder(ownStream),chunks=[];captureRec=ownRec;ownRec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};ownRec.onstop=async()=>{ownStream.getTracks().forEach(t=>t.stop());if(token!==captureSession)return;const blob=new Blob(chunks,{type:ownRec.mimeType});if(!blob.size)return toast('没有录到声音，请重新试一次');if(blob.size>1500000)return toast('这段录音较大，请缩短后重录');captureData=await blobData(blob);if(token!==captureSession)return;captureMime=blob.type;captureKind='voice';captureConfirm(false)};ownRec.start();captureActive=true;captureSeconds=0;$('#capture-mic').textContent='■　说完了，点这里';$('#capture-mic').classList.add('live');$('#capture-status').textContent='正在录音 · 0秒';captureTimer=setInterval(()=>{captureSeconds++;if($('#capture-status'))$('#capture-status').textContent='正在录音 · '+captureSeconds+'秒';if(captureSeconds>=30)stopCapture()},1000)}catch{ownStream?.getTracks().forEach(t=>t.stop());toast('无法打开麦克风，请检查权限，或改用拍照')}finally{captureBusy=false}}
function blobData(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('读取失败'));r.readAsDataURL(blob)})}
async function capturePhoto(input){const file=input.files[0];if(!file)return;if(!file.type.startsWith('image/'))return toast('请选择一张图片');if(file.size>20*1024*1024)return toast('照片太大，请选择20MB以内的图片');const token=++captureSession;try{const src=await blobData(file),img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=src});if(token!==captureSession)return;const canvas=document.createElement('canvas'),ratio=Math.min(1,1000/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*ratio));canvas.height=Math.max(1,Math.round(img.height*ratio));const c=canvas.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,canvas.width,canvas.height);c.drawImage(img,0,0,canvas.width,canvas.height);captureData=canvas.toDataURL('image/jpeg',.75);captureKind='photo';captureMime='image/jpeg';captureConfirm(false)}catch{toast('这张照片暂时无法打开，请尝试 JPG 或 PNG')}}
function captureConfirm(demo=false){const photo=captureKind==='photo';$('#overlay').innerHTML=`<div class="sheetwrap"><form class="sheet elder" role="dialog" aria-modal="true" aria-label="确认记录" onsubmit="saveCapture(event,${demo})"><div class="row"><h2>看一眼，再保存</h2><button type="button" class="close" onclick="closeSheet()" aria-label="关闭">×</button></div><div class="capture-source">${photo?`<img src="${captureData}" alt="刚刚选择的照片">`:`<audio controls src="${captureData}"></audio>`}</div><div class="warn">${demo?'以下是固定演示，不是对照片 / 录音的真实识别。请修改为实际情况。':'正式 Phase 1 会自动识别并预填；当前原型尚未接入真实模型，可手动整理或体验模拟识别。'}</div>${demo?'':`<button class="outline" type="button" onclick="captureConfirm(true)">体验模拟识别</button>`}<label for="cap-type">记什么</label><select id="cap-type" onchange="captureUnit()">${types.map(t=>`<option ${t===(photo?'辅食':'喂奶')?'selected':''}>${t}</option>`).join('')}</select><label id="cap-label" for="cap-value">${photo?'吃了什么 / 大约多少':'喝了多少（毫升）'}</label><input id="cap-value" required maxlength="100" ${photo?'type="text"':'type="number" min="1" max="2000"'} placeholder="${photo?'例如：南瓜粥半碗':'请填写实际奶量'}" value="${demo?(photo?'南瓜粥半碗':'180'):''}"><label>什么时候</label><div class="row"><input aria-label="记录日期" id="cap-date" required type="date" max="${today}" value="${today}"><input aria-label="记录时间" id="cap-time" required type="time" value="${nowTime()}"></div><label for="cap-note">补充一句（可不填）</label><input id="cap-note" maxlength="150" placeholder="例如：吃得很开心"><button class="primary" type="submit">✓　确认，保存记录</button><button class="outline" type="button" onclick="captureHub('${captureKind}')">${photo?'重新拍照':'重新说一遍'}</button><p class="muted" style="margin-top:13px">确认内容与${photo?'压缩照片':'录音'}仅保存在此浏览器，不会上传。</p></form></div>`}
function captureUnit(){const type=$('#cap-type').value,numeric=type==='喂奶'||type==='睡眠',input=$('#cap-value');$('#cap-label').textContent=type==='喂奶'?'喝了多少（毫升）':type==='睡眠'?'睡了多久（分钟）':'记录内容（请填写实际情况）';input.type=numeric?'number':'text';input.value='';input.placeholder=numeric?'请填写数字':'例如：食物与份量、观察到的情况';if(numeric){input.min=1;input.max=type==='喂奶'?2000:1440}else{input.removeAttribute('min');input.removeAttribute('max')}}
function saveCapture(e,demo){e.preventDefault();const type=$('#cap-type').value,raw=$('#cap-value').value.trim(),numeric=['喂奶','睡眠'].includes(type);if(!raw||numeric&&(!Number.isFinite(Number(raw))||Number(raw)<=0))return toast('请补充实际记录内容');const previous=structuredClone(state.records),record={id:Date.now(),type,value:numeric?Number(raw):raw,date:$('#cap-date').value,time:$('#cap-time').value,note:$('#cap-note').value.trim(),capture:{kind:captureKind,data:captureData,demo}};state.records.push(record);try{localStorage.setItem(key,JSON.stringify(state))}catch{state.records=previous;return toast('浏览器空间不足，未保存。请改用手动记录或清理旧附件后重试。')}closeSheet();page='records';selectedDate=record.date;filter='全部';render();$('#content').scrollTop=0;toast('记好了！可以在下方查看',()=>{state.records=previous;save();render()})}
const oldValueText=valueText;valueText=function(r){return oldValueText(r)+(r.capture?' · '+(r.capture.kind==='photo'?'照片':'语音')+(r.capture.demo?'（演示）':''):'')};
const oldHelp=help;help=function(){return oldHelp().replace('新增、修改、删除与撤销记录；','新增、修改、删除与撤销记录；拍照 / 语音记录（采集后确认保存，识别为演示）；').replace('音频仅在页面内临时播放，刷新后会释放。','哭声监测音频仅在页面内临时播放。记录模块中确认保存的照片与录音，会随记录保存在当前浏览器。')};
$('#map').innerHTML=$('#map').innerHTML.replace('02 快速记录','02 拍照 / 语音记录');document.querySelector('.feature-note').innerHTML='Phase 1 AI 辅助记录：语音 ASR、图片 Vision、大按钮、自动预填、确认后保存。<br><br>当前原型仅在本机处理照片与录音，识别为演示；正式实现接真实模型。';
window.addEventListener('pagehide',()=>stopCapture(true));render();
