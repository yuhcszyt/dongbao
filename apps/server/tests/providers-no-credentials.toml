# 专供「provider 已启用但凭证没配」这条路径的用例：走真实 provider 代码，不 patch 任何 provider 函数。
# base_url / endpoint 都指向不可达地址——正常路径应当在发请求之前就以 ProviderUnavailable 降级。
[large_model]
provider = "openai_compatible"
enabled = true
base_url = "https://unreachable.invalid/v1"
model = "test-model"
supports_vision = true
timeout_seconds = 5
api_key_env = "MODEL_API_KEY"

[embedding]
provider = "openai_compatible"
enabled = true
base_url = "https://tokenhub.tencentmaas.com/v1"
model = "kinfra-text-embedding-4b"
dimensions = 2560
timeout_seconds = 5
api_key_env = "EMBEDDING_API_KEY"

[tencent_asr]
enabled = true
endpoint = "https://unreachable.invalid"
region = "ap-guangzhou"
engine_model_type = "16k_zh"
voice_format = "wav"
timeout_seconds = 5
secret_id_env = "TENCENT_SECRET_ID"
secret_key_env = "TENCENT_SECRET_KEY"
